<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESİLA ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#09000d;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 45%, #78002f 0%, #2c003c 32%, #10001c 68%, #050008 100%);
    color:white;
}

/* Arka plan ışıkları */

body::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    background:#ff006a;
    filter:blur(180px);
    opacity:.20;
    animation:bgPulse 4s infinite ease-in-out;
}

@keyframes bgPulse{
    0%,100%{transform:scale(.85);opacity:.15;}
    50%{transform:scale(1.15);opacity:.28;}
}

/* Sol üst */

.infinity{
    position:absolute;
    top:22px;
    left:24px;
    z-index:10;
    font-size:28px;
    font-weight:bold;
    color:#ff477f;
    text-shadow:
        0 0 8px #ff006a,
        0 0 18px #ff006a,
        0 0 35px #ff006a;
    animation:infinityGlow 2s infinite alternate;
}

@keyframes infinityGlow{
    from{opacity:.65;}
    to{opacity:1;}
}

/* Ana alan */

.container{
    position:relative;
    width:min(100vw,1000px);
    height:min(100vh,900px);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Kalp */

.heart{
    width:82vw;
    max-width:780px;
    min-width:330px;
    filter:
        drop-shadow(0 0 8px #ff006a)
        drop-shadow(0 0 20px #ff006a)
        drop-shadow(0 0 45px rgba(255,0,100,.65));

    animation:heartbeat 1.35s infinite ease-in-out;
    transform-origin:center;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    12%{
        transform:scale(1.035);
    }

    20%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.025);
    }

    40%{
        transform:scale(1);
    }
}

/* Kalp yazıları */

.heartText{
    fill:#ffb6d5;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
    opacity:.9;
}

.heartText2{
    fill:#ff3f83;
    font-size:12px;
    letter-spacing:1.5px;
    opacity:.75;
}

/* ESİLA */

.name{
    position:absolute;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    z-index:5;

    font-family:Georgia, serif;
    font-size:clamp(45px,10vw,105px);
    letter-spacing:8px;
    color:white;

    text-shadow:
        0 0 5px white,
        0 0 12px #ff4b91,
        0 0 25px #ff006a,
        0 0 55px #ff006a;

    animation:nameGlow 1.35s infinite ease-in-out;
}

@keyframes nameGlow{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }
    12%{
        transform:translate(-50%,-50%) scale(1.05);
    }
    20%{
        transform:translate(-50%,-50%) scale(1);
    }
    30%{
        transform:translate(-50%,-50%) scale(1.035);
    }
    40%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* Alt yazı */

.loveMessage{
    position:absolute;
    top:61%;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;

    color:#ffc4dc;
    font-size:clamp(12px,2.8vw,19px);
    letter-spacing:2px;

    text-shadow:
        0 0 8px #ff006a,
        0 0 18px #ff006a;

    transition:.6s ease;
}

/* ECG */

.ecg{
    position:absolute;
    bottom:8%;
    left:50%;
    transform:translateX(-50%);
    width:88%;
    max-width:800px;
    height:80px;

    filter:
        drop-shadow(0 0 5px #ff006a)
        drop-shadow(0 0 12px #ff006a);
}

.ecg path{
    fill:none;
    stroke:#ff2477;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:900;
    stroke-dashoffset:900;

    animation:ecgMove 3s linear infinite;
}

@keyframes ecgMove{
    to{
        stroke-dashoffset:0;
    }
}

/* Parçacıklar */

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ff3d82;

    box-shadow:
        0 0 6px #ff006a,
        0 0 14px #ff006a;

    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(100vh) scale(.3);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.8;
    }

    to{
        transform:translateY(-20vh) scale(1);
        opacity:0;
    }
}

/* Küçük kalp */

.littleHeart{
    position:absolute;
    color:#ff347e;
    font-size:20px;
    text-shadow:
        0 0 8px #ff006a,
        0 0 18px #ff006a;
    animation:littleBeat 1.35s infinite;
}

@keyframes littleBeat{
    0%,100%{transform:scale(1);}
    15%{transform:scale(1.4);}
    30%{transform:scale(1);}
}
</style>
</head>

<body>

<!-- Sol üst -->
<div class="infinity">∞ ❤️</div>

<div class="container">

    <!-- NEON KALP -->
    <svg class="heart"
         viewBox="0 0 800 700"
         xmlns="http://www.w3.org/2000/svg">

        <defs>

            <!-- Kalp yolu -->
            <path id="heartPath"
                d="
                M400 620
                C370 585 100 410 100 210
                C100 80 270 55 400 205
                C530 55 700 80 700 210
                C700 410 430 585 400 620
                Z"/>

            <path id="heartPath2"
                d="
                M400 590
                C360 550 130 395 130 215
                C130 115 260 90 400 230
                C540 90 670 115 670 215
                C670 395 440 550 400 590
                Z"/>

            <filter id="glow">
                <feGaussianBlur stdDeviation="4"
                    result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

        </defs>

        <!-- Kalpın neon gölgesi -->
        <use href="#heartPath"
             fill="none"
             stroke="#ff006a"
             stroke-width="7"
             opacity=".35"
             filter="url(#glow)"/>

        <!-- Yazılar -->
        <text class="heartText">
            <textPath href="#heartPath"
                      startOffset="0%">
                I LOVE YOU • YOU ARE MY WORLD • FOREVER WITH YOU • MY HEART BELONGS TO YOU • I MISS YOU • YOU ARE SPECIAL • I LOVE YOU • YOU ARE MY WORLD • FOREVER WITH YOU • MY HEART BELONGS TO YOU • I MISS YOU • YOU ARE SPECIAL •
            </textPath>
        </text>

        <text class="heartText2">
            <textPath href="#heartPath2"
                      startOffset="25%">
                FOREVER • MY LOVE • MY HEART • ONLY YOU • ALWAYS YOU • LOVE YOU MORE • MY EVERYTHING • FOREVER • MY LOVE • MY HEART • ONLY YOU • ALWAYS YOU • LOVE YOU MORE • MY EVERYTHING •
            </textPath>
        </text>

        <!-- Hareket eden küçük ışık -->
        <circle r="5" fill="#fff">
            <animateMotion
                dur="4s"
                repeatCount="indefinite">
                <mpath href="#heartPath"/>
            </animateMotion>
        </circle>

        <circle r="3" fill="#ff80b0">
            <animateMotion
                dur="6s"
                begin="1s"
                repeatCount="indefinite">
                <mpath href="#heartPath2"/>
            </animateMotion>
        </circle>

    </svg>

    <!-- İsim -->
    <div class="name">ESİLA</div>

    <!-- Değişen mesaj -->
    <div class="loveMessage" id="loveMessage">
        You are the reason my heart beats ❤️
    </div>

    <!-- ECG -->
    <svg class="ecg"
         viewBox="0 0 1000 100"
         preserveAspectRatio="none">

        <path d="
        M0 55
        L80 55
        L110 55
        L125 20
        L140 82
        L155 45
        L175 55
        L300 55
        L330 55
        L345 25
        L360 80
        L375 42
        L395 55
        L520 55
        L550 55
        L565 18
        L580 84
        L595 43
        L615 55
        L740 55
        L770 55
        L785 23
        L800 82
        L815 42
        L835 55
        L1000 55
        "/>

    </svg>

</div>

<script>

/* Değişen İngilizce sevgi sözleri */

const messages = [
    "You are the reason my heart beats ❤️",
    "I will choose you in every lifetime ❤️",
    "You are my favorite person in this world ❤️",
    "My heart always finds its way back to you ❤️",
    "Every heartbeat reminds me of you ❤️",
    "You make my world brighter ❤️",
    "I love you more than words can say ❤️",
    "Forever sounds better with you ❤️",
    "You are my beautiful forever ❤️",
    "My heart belongs to you, Esila ❤️"
];

let index = 0;
const message = document.getElementById("loveMessage");

setInterval(() => {

    message.style.opacity = "0";
    message.style.transform =
        "translateX(-50%) translateY(8px)";

    setTimeout(() => {

        index = (index + 1) % messages.length;

        message.textContent = messages[index];

        message.style.opacity = "1";
        message.style.transform =
            "translateX(-50%) translateY(0)";

    },600);

},3500);


/* Arka plan parçacıkları */

for(let i=0;i<45;i++){

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left = Math.random()*100 + "%";

    p.style.animationDuration =
        (5 + Math.random()*8) + "s";

    p.style.animationDelay =
        (-Math.random()*10) + "s";

    p.style.opacity =
        .2 + Math.random()*.8;

    document.body.appendChild(p);
}


/* Küçük kalpler */

for(let i=0;i<8;i++){

    const h = document.createElement("div");

    h.className = "littleHeart";
    h.textContent = "♥";

    h.style.left =
        (10 + Math.random()*80) + "%";

    h.style.top =
        (10 + Math.random()*75) + "%";

    h.style.animationDelay =
        Math.random()*1.5 + "s";

    h.style.opacity = .3 + Math.random()*.6;

    document.querySelector(".container").appendChild(h);
}

</script>

</body>
</html>
