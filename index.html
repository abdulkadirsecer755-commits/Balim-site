<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balım</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Cormorant Garamond', serif;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 640px;
            width: 100%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 2.1rem;
            letter-spacing: 1px;
            margin-bottom: 50px;
            color: #f5f5f5;
            text-align: center;
            font-style: italic;
        }

        .letter {
            font-size: 1.25rem;
            color: #d0d0d0;
        }

        .letter p {
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeIn 1.4s ease forwards;
        }

        .letter p:nth-child(1) { animation-delay: 0.3s; }
        .letter p:nth-child(2) { animation-delay: 0.6s; }
        .letter p:nth-child(3) { animation-delay: 0.9s; }
        .letter p:nth-child(4) { animation-delay: 1.2s; }
        .letter p:nth-child(5) { animation-delay: 1.5s; }
        .letter p:nth-child(6) { animation-delay: 1.8s; }
        .letter p:nth-child(7) { animation-delay: 2.1s; }
        .letter p:nth-child(8) { animation-delay: 2.4s; }
        .letter p:nth-child(9) { animation-delay: 2.7s; }
        .letter p:nth-child(10) { animation-delay: 3.0s; }
        .letter p:nth-child(11) { animation-delay: 3.3s; }
        .letter p:nth-child(12) { animation-delay: 3.6s; }
        .letter p:nth-child(13) { animation-delay: 3.9s; }

        .signature {
            margin-top: 60px;
            text-align: right;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: #f0f0f0;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 4.3s;
        }

        .line {
            width: 60px;
            height: 1px;
            background: #555;
            margin: 50px auto;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .music-btn:hover {
            border-color: #ccc;
            color: #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>balım...</h1>
